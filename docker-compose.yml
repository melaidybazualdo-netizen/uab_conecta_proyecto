version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_uab
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./uab_conecta_server
    container_name: backend_uab
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/uab_conecta
      - JWT_SECRET=secretkey
    depends_on:
      - mongodb

  frontend:
    build: ./uab_conecta_client
    container_name: frontend_uab
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data: